<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postmark Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <section class="screen landing" id="landing">
    <div class="landing-bg" id="landing-bg">
      <div class="landing-bg__layer is-active" style="background-image: url('assets/background.jpg')"></div>
      <div class="landing-bg__layer" style="background-image: url('assets/background_2.jpg')"></div>
      <div class="landing-bg__layer" style="background-image: url('assets/background_3.jpg')"></div>
      <div class="landing-bg__layer" style="background-image: url('assets/background_4.jpg')"></div>
      <div class="landing-bg__layer" style="background-image: url('assets/background_5.jpg')"></div>
    </div>

    <header class="bar bar--top">
      <a class="link" href="https://maps.app.goo.gl/3g3mZiCtDEW2cmVa7" target="_blank" rel="noopener">326 6th Street</a>
      <button class="link link--button" id="info-open" type="button">Info</button>
    </header>

    <img class="logo" src="assets/logo.svg" alt="Postmark">

    <footer class="bar bar--bottom">
      <a class="link" href="https://www.zeffy.com/en-US/donation-form/donate-to-fund-our-free-fridge?zlinkid=1cd377cc-bbf9-47c9-9aef-a25f1c37a5fa" target="_blank" rel="noopener">Donate</a>
      <a class="link" href="https://www.instagram.com/postmarkcafe/?hl=en" target="_blank" rel="noopener">Instagram</a>
    </footer>
  </section>

  <section class="screen info" id="info" hidden>
    <header class="bar bar--top">
      <a class="link link--dark" href="https://maps.app.goo.gl/3g3mZiCtDEW2cmVa7" target="_blank" rel="noopener">326 6th Street</a>
      <button class="link link--button link--dark" id="info-close" type="button">Close</button>
    </header>

    <div class="info__body">
      <div class="info__text">
        <p>Postmark Cafe is a neighborhood coffee shop &amp; community space located at 326 6th St in Park Slope, Brooklyn.</p>
        <p>They brew <a class="info__link" href="https://twinenginecoffee.com/" target="_blank" rel="noopener">Twin Engine</a> coffee and make a decent mocha latte.</p>
        <p>Come say hello!</p>
      </div>
    </div>

    <footer class="bar bar--bottom">
      <a class="link link--dark" href="https://www.zeffy.com/en-US/donation-form/donate-to-fund-our-free-fridge?zlinkid=1cd377cc-bbf9-47c9-9aef-a25f1c37a5fa" target="_blank" rel="noopener">Donate</a>
      <a class="link link--dark" href="https://www.instagram.com/postmarkcafe/?hl=en" target="_blank" rel="noopener">Instagram</a>
    </footer>
  </section>

  <script src="script.js"></script>
</body>
</html>
